# Daily backup of the family data + keep-alive of the free Supabase project.
# If it fails, GitHub sends an email to the repository owner.
name: Backup giornaliero

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup (also keeps Supabase awake)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: python3 scripts/backup.py
      - name: Save the backup in the repository if the data changed
        run: |
          git config user.name "FamilyApp backup"
          git config user.email "actions@users.noreply.github.com"
          git add backups/backup.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Backup $(date -u +%Y-%m-%d)" && git push
          fi
