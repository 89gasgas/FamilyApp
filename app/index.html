<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d5b">
  <title>FamilyApp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Spesa</h1>
    <span id="sync" class="sync" aria-live="polite"></span>
    <button id="flyers-btn" class="ghost" hidden>Volantini</button>
    <button id="logout-btn" class="ghost small" hidden aria-label="Esci">Esci</button>
  </header>

  <main>
    <section id="login" class="panel" hidden>
      <p>Accedi una volta sola: l'app ti ricorda.</p>
      <button id="google-btn" class="primary">Accedi con Google</button>
      <div id="dev-login" hidden>
        <p class="hint">Solo in locale: accesso di prova</p>
        <button data-dev="0" class="ghost">Entra come GaS (prova)</button>
        <button data-dev="1" class="ghost">Entra come Chips (prova)</button>
      </div>
    </section>

    <section id="denied" class="panel" hidden>
      <p>Questo account non fa parte della famiglia. Non ci sono dati da mostrare.</p>
    </section>

    <section id="list" hidden>
      <form id="add-form" autocomplete="off">
        <input id="add-input" placeholder="Aggiungi un prodotto…" enterkeyhint="done" aria-label="Nuovo prodotto">
        <button class="primary" aria-label="Aggiungi">+</button>
      </form>
      <ul id="active" class="items"></ul>
      <p id="empty" class="hint" hidden>Niente da comprare.</p>
      <h2 id="bought-title">Comprati</h2>
      <ul id="bought" class="items bought"></ul>
    </section>
  </main>

  <dialog id="flyers">
    <h2>Volantini</h2>
    <a href="https://www.lidl.it/c/volantino-lidl/s10018048" target="_blank" rel="noopener">Lidl<small>Via Principessa di Piemonte 1</small></a>
    <a href="https://www.mymercato.it/mondo-mercato/volantini" target="_blank" rel="noopener">Mercatò Local<small>C.so Principi di Piemonte 45</small></a>
    <form method="dialog"><button class="ghost">Chiudi</button></form>
  </dialog>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
